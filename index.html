<style>

:root{

var fmtS=function(s){var d=parse(s);return d.getDate()+' '+MON[d.getMonth()]};
var fmtL=function(s){var d=parse(s);return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()};
var money=function(n){return '$'+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0})};
var uid=function(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var CATS=['Compact','Sedan','Jeep','SUV','Large SUV (7-seater)','Pick up'];
var TABS=[['calendar','Calendar'],['fleet','Fleet'],['bookings','Bookings'],['payments','Payments']];

var S={ready:false,vid:null,month:null,back:'calendar',tab:'calendar',start:today(),span:14,cat:'all',vehicles:[],bookings:[],bills:[],billPaid:[],bf:'all',q:'',
  readOnly:false,warn:'',modal:null,fin:{start:today(),startTime:'09:00',end:addDays(today(),2),endTime:'09:00',cat:'all'}};
var db=null,gotV=false,gotB=false;
var LS='fleetdesk.v1';

function use(n){try{return window.claude&&window.claude.use?Promise.resolve(window.claude.use(n)).catch(function(){return null}):Promise.resolve(null)}catch(e){return Promise.resolve(null)}}
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},3200)}

/* ---------- storage ---------- */
function lsLoad(){try{var o=JSON.parse(localStorage.getItem(LS)||'{}');S.vehicles=o.vehicles||[];S.bookings=o.bookings||[]}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({vehicles:S.vehicles,bookings:S.bookings}))}catch(e){}}
function save(col,obj){
  if(db){
    var data=Object.assign({},obj);delete data.id;
    return db.collection(col).doc(obj.id).set(data).then(function(){return true},function(e){
      toast(e&&e.code==='permission-denied'?'Your account does not have permission to save.':'Could not save. Try again.');return false});
  }
  var arr=S[col],i=arr.findIndex(function(x){return x.id===obj.id});
  if(i>=0)arr[i]=obj;else arr.push(obj);
  lsSave();renderAll();return Promise.resolve(true);
}
function remove(col,id){
  if(db)return db.collection(col).doc(id).delete().then(function(){return true},function(){toast('Could not delete. Try again.');return false});
  S[col]=S[col].filter(function(x){return x.id!==id});lsSave();renderAll();return Promise.resolve(true);
}

/* ---------- domain ---------- */
var byName=function(a,b){return String(a.name).localeCompare(String(b.name))};
var vById=function(id){return S.vehicles.find(function(v){return v.id===id})};
var covers=function(b,d){return b.start<=d&&d<=b.end};
var busyOn=function(vid,d){return S.bookings.find(function(b){return b.vehicleId===vid&&covers(b,d)})};
var sdt=function(b){return b.start+'T'+(b.startTime||'00:00')};
var edt=function(b){return b.end+'T'+(b.endTime||'23:59')};
var busyAll=function(vid,d){return S.bookings.filter(function(b){return b.vehicleId===vid&&covers(b,d)}).sort(function(a,c){return sdt(a)<sdt(c)?-1:1})};
/* Two bookings clash only when their date and time ranges overlap, so a car can come back in the morning and go out again that afternoon. */
var conflicts=function(vid,s,e,except,st,et){var ns=s+'T'+(st||'00:00'),ne=e+'T'+(et||'23:59');return S.bookings.filter(function(b){return b.vehicleId===vid&&b.id!==except&&sdt(b)<ne&&ns<edt(b)})};
var days=function(s,e){return diff(s,e)+1};
var fmtT=function(t){if(!t)return '';var p=t.split(':'),h=Number(p[0]);return (h%12||12)+':'+p[1]+' '+(h<12?'AM':'PM')};
var whenS=function(d,t){return fmtS(d)+(t?', '+fmtT(t):'')};
/* Rentals are counted in 24-hour blocks: 9:00 AM to 9:00 AM two days later is 2 days, and any part of another day counts as one more. */
/* A return up to 3 hours after a full 24-hour block is free; after that the next day is charged. */
var GRACE_MIN=180;
var rentalDays=function(b){
  if(b.startTime&&b.endTime){
    var a=parse(b.start),z=parse(b.end),sp=b.startTime.split(':'),ep=b.endTime.split(':');
    a.setHours(Number(sp[0]),Number(sp[1]));z.setHours(Number(ep[0]),Number(ep[1]));
    return Math.max(1,Math.ceil((Math.round((z-a)/60000)-GRACE_MIN)/1440));
  }
  return days(b.start,b.end);
};
var bTotal=function(b){if(b.total!=null&&b.total!=='')return Number(b.total)||0;return (b.rate||0)*rentalDays(b)};
/* One colour per car: [key, name, background, text] */
var PALETTE=[['lightblue','Light blue','#8FD0F5','#0B2A40'],['red','Red','#D93636','#FFFFFF'],['royalblue','Royal blue','#2F54C8','#FFFFFF'],['orange','Orange','#F08A1C','#2B1600'],['green','Green','#2E9E5B','#FFFFFF'],['peach','Peach','#FFB99A','#3A1A0A'],['purple','Purple','#7A3FC1','#FFFFFF'],['darkgrey','Dark grey','#5A676C','#FFFFFF'],['lilac','Lilac','#C9B3F0','#2A1B4D'],['yellow','Yellow','#F5D838','#2B2400'],['burgundy','Burgundy','#7E1F3A','#FFFFFF'],['teal','Teal','#0B7A75','#FFFFFF']];
var colorOf=function(v){var k=v&&v.color;for(var i=0;i<PALETTE.length;i++){if(PALETTE[i][0]===k)return PALETTE[i]}return PALETTE[PALETTE.length-1]};
var vcVars=function(v){var c=colorOf(v);return '--vc:'+c[2]+';--vi:'+c[3]};
var dot=function(v){return '<i class="dot" style="'+vcVars(v)+'"></i>'};
function nextColor(){var used={};S.vehicles.forEach(function(v){used[v.color]=1});for(var i=0;i<PALETTE.length-1;i++){if(!used[PALETTE[i][0]])return PALETTE[i][0]}return 'teal'}
function locLine(b){if(b.type==='maintenance')return '';var p=[];if(b.staying)p.push('Staying: '+esc(b.staying));if(b.pickup)p.push('Pick-up: '+esc(b.pickup));if(b.dropoff)p.push('Drop-off: '+esc(b.dropoff));return p.length?'<span class="sub">'+p.join(' · ')+'</span>':''}
function whenLine(b){var n=rentalDays(b);return whenS(b.start,b.startTime)+' – '+whenS(b.end,b.endTime)+' <span class="sub">· '+n+(n===1?' day':' days')+'</span>'}
function vStatus(v,d){
  var b=busyOn(v.id,d);
  if(b)return {k:b.type==='maintenance'?'maint':'rent',b:b};
  var next=S.bookings.filter(function(x){return x.vehicleId===v.id&&x.start>d}).sort(function(a,c){return a.start<c.start?-1:1})[0];
  return {k:'free',next:next};
}
function bState(b,t){return b.end<t?'past':(b.start<=t?'active':'up')}
function statusPill(v){
  var t=today(),st=vStatus(v,t);
  if(st.k==='rent')return '<span class="pill rent">On rental · back '+whenS(st.b.end,st.b.endTime)+'</span>';
  if(st.k==='maint')return '<span class="pill maint">Workshop · until '+whenS(st.b.end,st.b.endTime)+'</span>';
  return '<span class="pill free">Free'+(st.next?' until '+fmtS(addDays(st.next.start,-1)):'')+'</span>';
}
var canWrite=function(){return !S.readOnly};

/* ---------- render ---------- */
function renderAll(){
  $('#today-label').textContent=fmtL(today());
  $('#top-actions').innerHTML='<button class="btn" data-action="backup">Backup</button>'+(canWrite()?'<button class="btn primary" data-action="new-booking">New booking</button>':'');
  var late=S.bookings.filter(isLate);
  $('#banner').innerHTML=(S.warn?'<div class="note">'+esc(S.warn)+'</div>':'')+(late.length?'<button class="late-banner" data-action="today-list" data-v="late">'+late.length+(late.length===1?' overdue return':' overdue returns')+' - tap to see</button>':'')+payBanner();
  renderStats();renderTabs();renderMain();
}
function renderStats(){
  var t=today(),n=S.vehicles.length,free=0,rent=0,maint=0;
  S.vehicles.forEach(function(v){var k=vStatus(v,t).k;if(k==='free')free++;else if(k==='rent')rent++;else maint++});
  var picks=S.bookings.filter(function(b){return b.type==='rental'&&b.start===t});
  var rets=S.bookings.filter(function(b){return b.type==='rental'&&b.end===t});
  var first=function(list,key){if(!list.length)return 'none today';var ts=list.map(function(b){return b[key]||''}).filter(Boolean).sort();return ts.length?'first at '+fmtT(ts[0]):'today'};
  var items=[[free,'Free today','of '+n+(n===1?' car':' cars')],[rent,'On rental','out right now'],[maint,'In workshop','unavailable'],[picks.length,'Deliveries today',first(picks,'startTime')],[rets.length,'Returns today',first(rets,'endTime')]];
  var keys={'Deliveries today':'out','Returns today':'in'};
  $('#stats').innerHTML=items.map(function(i){var k=keys[i[1]];
    return k?'<button class="stat" data-action="today-list" data-v="'+k+'"><span>'+i[1]+'</span><b>'+i[0]+'</b><i>'+i[2]+'</i></button>'
      :'<div class="stat"><span>'+i[1]+'</span><b>'+i[0]+'</b><i>'+i[2]+'</i></div>'}).join('');
}
function renderTabs(){
  var pn=payAttention().length;
  $('#tabs').innerHTML=TABS.map(function(t){return '<button class="tab" role="tab" aria-selected="'+(S.tab===t[0])+'" data-action="tab" data-v="'+t[0]+'">'+t[1]+(t[0]==='payments'&&pn?'<span class="badge">'+pn+'</span>':'')+'</button>'}).join('');
}
function renderMain(){
  var sc=$('.tl-scroll'),left=sc?sc.scrollLeft:0;
  var h=S.tab==='vehicle'?vehicleHTML():S.tab==='fleet'?fleetHTML():S.tab==='bookings'?bookingsHTML():S.tab==='payments'?paymentsHTML():calHTML();
  $('#main').innerHTML=h;
  if(S.tab==='bookings')renderBkList();
  var sc2=$('.tl-scroll');if(sc2)sc2.scrollLeft=left;
}
function emptyFleet(){
  return '<div class="empty"><h2>No cars in the fleet yet</h2><p>Add your vehicles and their daily rates. The calendar then shows which cars are free on every day.</p>'+(canWrite()?'<button class="btn primary" data-action="add-vehicle">Add first vehicle</button>':'')+'</div>';
}
function calHTML(){
  if(!S.vehicles.length)return emptyFleet();
  var t=today(),vs=S.vehicles.filter(function(v){return S.cat==='all'||v.category===S.cat}).sort(byName);
  var s=S.start,e=addDays(s,S.span-1),ds=[],i;
  for(i=0;i<S.span;i++)ds.push(addDays(s,i));
  var cats=Array.from(new Set(S.vehicles.map(function(v){return v.category}).filter(Boolean))).sort();
  var ctl='<div class="bar-row"><div class="seg"><button class="btn" data-action="nav" data-n="-7">&larr; Week</button><button class="btn" data-action="today">Today</button><button class="btn" data-action="nav" data-n="7">Week &rarr;</button></div>'+
    '<label class="inl">Jump to<input type="date" id="c-jump" value="'+s+'"></label>'+
    '<label class="inl">Show<select id="c-span">'+[7,14,30].map(function(n){return '<option value="'+n+'"'+(n===S.span?' selected':'')+'>'+n+' days</option>'}).join('')+'</select></label>'+
    '<label class="inl">Type<select id="c-cat"><option value="all">All</option>'+cats.map(function(c){return '<option'+(c===S.cat?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select></label></div>';
  var head='<div class="tl-r hd"><div class="tl-veh"><span class="lab">Vehicle</span></div><div class="tl-track">'+ds.map(function(d,j){
    var dt=parse(d),w=dt.getDay();
    return '<div class="dh'+(w%6===0?' we':'')+(d===t?' td':'')+'"><span class="mon">'+(j===0||dt.getDate()===1?MON[dt.getMonth()]:'')+'</span><span>'+DOW[w]+'</span><b>'+dt.getDate()+'</b></div>';
  }).join('')+'</div></div>';
  var rows=vs.map(function(v){
    var cells=ds.map(function(d,j){
      var w=parse(d).getDay(),cls='cell'+(w%6===0?' we':'')+(d===t?' td':''),st='grid-column:'+(j+1);
      return canWrite()?'<button class="'+cls+'" style="'+st+'" data-action="cell" data-v="'+v.id+'" data-d="'+d+'" aria-label="Book '+esc(v.name)+' on '+fmtS(d)+'"></button>':'<div class="'+cls+'" style="'+st+'"></div>';
    }).join('');
    var bars=S.bookings.filter(function(b){return b.vehicleId===v.id&&b.end>=s&&b.start<=e}).map(function(b){
      var cs=b.start>s?b.start:s,ce=b.end<e?b.end:e,c1=diff(s,cs)+1,c2=diff(s,ce)+2;
      var m=b.type==='maintenance',label=m?'Workshop · '+b.customer:b.customer;
      var hs=S.bookings.some(function(o){return o.id!==b.id&&o.vehicleId===v.id&&o.end===b.start});
      var he=S.bookings.some(function(o){return o.id!==b.id&&o.vehicleId===v.id&&o.start===b.end});
      if(b.start===b.end&&hs&&he)he=false;
      var cls='bar'+(m?' maint':'')+(b.end<t?' past':'')+(b.start<s?' cl':'')+(b.end>e?' cr':'')+(hs&&b.start>=s?' hs':'')+(he&&b.end<=e?' he':'');
      var tip=label+' ('+whenS(b.start,b.startTime)+' – '+whenS(b.end,b.endTime)+')';
      var tag=canWrite()?'button':'div';
      return '<'+tag+' class="'+cls+'" style="grid-column:'+c1+'/'+c2+';'+vcVars(v)+'" data-action="edit-booking" data-id="'+b.id+'" title="'+esc(tip)+'">'+esc(label)+'</'+tag+'>';
    }).join('');
    return '<div class="tl-r"><div class="tl-veh" style="'+vcVars(v)+'" data-action="open-vehicle" data-id="'+v.id+'"><button class="vlink vn" data-action="open-vehicle" data-id="'+v.id+'" title="Open calendar for '+esc(v.name)+'">'+esc(v.name)+'</button><span class="plate">'+esc(v.plate)+'</span></div><div class="tl-track">'+cells+bars+'</div></div>';
  }).join('');
  var foot='<div class="tl-r ft"><div class="tl-veh"><span class="lab">Cars free</span></div><div class="tl-track">'+ds.map(function(d){
    var n=vs.filter(function(v){return !busyOn(v.id,d)}).length,w=parse(d).getDay();
    return '<div class="fc'+(n===0?' zero':'')+(w%6===0?' we':'')+(d===t?' td':'')+'">'+n+'</div>';
  }).join('')+'</div></div>';
  var legend='<div class="legend"><span><i class="sw rent"></i>Rental (colour matches the car)</span><span><i class="sw maint"></i>Workshop</span><span><i class="sw td"></i>Today</span>'+(canWrite()?'<span>Tap an empty day to book that car</span>':'')+'</div>';
  var tl='<div class="range">'+fmtS(s)+' – '+fmtS(e)+' '+parse(e).getFullYear()+'</div>'+
    (vs.length?'<div class="tl-scroll"><div class="tl" style="--cols:'+S.span+'">'+head+rows+foot+'</div></div>':'<div class="empty"><p>No cars of this type.</p></div>')+legend;
  return ctl+tl+finderHTML();
}
function finderHTML(){
  var f=S.fin,cats=Array.from(new Set(S.vehicles.map(function(v){return v.category}).filter(Boolean))).sort();
  return '<div class="panel"><h2>Check availability</h2><div class="fin-form">'+
    '<label>From date<input type="date" id="fin-start" value="'+f.start+'"></label>'+
    '<label>From time<input type="time" id="fin-stime" value="'+esc(f.startTime)+'"></label>'+
    '<label>To date<input type="date" id="fin-end" value="'+f.end+'"></label>'+
    '<label>To time<input type="time" id="fin-etime" value="'+esc(f.endTime)+'"></label>'+
    '<label>Type<select id="fin-cat"><option value="all">All</option>'+cats.map(function(c){return '<option'+(c===f.cat?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select></label></div>'+
    finderResults()+'</div>';
}
var moneyP=function(n){n=Number(n)||0;return '$'+n.toLocaleString('en-US',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})};
/* No deliveries or collections are done on 25 December. */
var noServiceDay=function(d){return !!d&&d.slice(5)==='12-25'};
function priceCells(v,n){
  var pr=priceBreakdown({start:S.fin.start,end:S.fin.end,startTime:S.fin.startTime,endTime:S.fin.endTime},v);
  if(!pr)return '<div class="c2 sub">'+money(v.rate)+' per day</div><div class="num">'+money((v.rate||0)*n)+'</div>';
  var parts=pr.runs.map(function(x){return x.n+' × '+money(x.r)}).join(' + ');
  if(pr.extra>0)parts+=' + holiday '+moneyP(pr.extra);
  return '<div class="c2 sub" title="'+priceText(pr).replace(/"/g,'&quot;')+'">'+parts+(pr.extra>0?'<br>'+esc(pr.hd&&pr.hc?'Holiday pick-up and return':pr.hd?'Holiday pick-up: '+pr.hd:'Holiday return: '+pr.hc):'')+'</div><div class="num">'+moneyP(pr.total)+'</div>';
}
function finderResults(){
  var f=S.fin;
  if(!f.start||!f.end||!f.startTime||!f.endTime)return '<p class="bad">Enter both dates and both times.</p>';
  if(f.end+'T'+f.endTime<=f.start+'T'+f.startTime)return '<p class="bad">The return must be after the pick-up.</p>';
  if(noServiceDay(f.start)||noServiceDay(f.end))return '<p class="bad">We do not do deliveries or collections on 25 December. The '+(noServiceDay(f.start)?'pick-up':'return')+' date falls on it, so choose another day.</p>';
  var n=rentalDays({start:f.start,end:f.end,startTime:f.startTime,endTime:f.endTime});
  var list=S.vehicles.filter(function(v){return (f.cat==='all'||v.category===f.cat)&&!conflicts(v.id,f.start,f.end,null,f.startTime,f.endTime).length}).sort(byName);
  var head='<p class="sub" style="margin:8px 0 0;color:var(--muted)">'+list.length+' of '+S.vehicles.length+' cars free from '+whenS(f.start,f.startTime)+' to '+whenS(f.end,f.endTime)+' · '+n+(n===1?' day':' days')+' · prices from the rate card</p>';
  if(!list.length)return head;
  return head+'<div class="list">'+list.map(function(v){
    return '<div class="row"><div class="main"><strong>'+dot(v)+esc(v.name)+'</strong><span><span class="plate">'+esc(v.plate)+'</span> <span class="sub">'+esc([v.category,v.seats?v.seats+' seats':'',v.transmission].filter(Boolean).join(' · '))+'</span></span></div>'+
      priceCells(v,n)+
      (canWrite()?'<button class="btn sm primary" data-action="book-from-finder" data-v="'+v.id+'">Book</button>':'<span></span>')+'</div>';
  }).join('')+'</div>';
}
var FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthAdd(m,n){var x=parse(m);return iso(new Date(x.getFullYear(),x.getMonth()+n,1))}
function vehicleHTML(){
  if(!S.ready)return '<p style="color:var(--muted)">Loading…</p>';
  var v=vById(S.vid);
  if(!v)return '<div class="empty"><h2>Car not found</h2><p>It may have been removed from the fleet.</p><button class="btn" data-action="back">Back</button></div>';
  if(!S.month)S.month=today().slice(0,8)+'01';
  var t=today(),first=parse(S.month),mon=first.getMonth(),dim=new Date(first.getFullYear(),mon+1,0).getDate();
  var off=first.getDay(),weeks=Math.ceil((off+dim)/7),gs=addDays(S.month,-off),k,i;
  var freeN=0;for(k=0;k<dim;k++){if(!busyOn(v.id,addDays(S.month,k)))freeN++}
  var head='<div class="vhead"><div><button class="btn sm" data-action="back">&larr; Back</button><h2>'+dot(v)+esc(v.name)+'</h2><div class="facts"><span class="plate">'+esc(v.plate)+'</span><span>'+esc([v.category,v.seats?v.seats+' seats':'',v.transmission].filter(Boolean).join(' · '))+'</span><span>'+money(v.rate)+' per day</span>'+statusPill(v)+'</div></div>'+
    '<div class="seg">'+(canWrite()?'<button class="btn" data-action="edit-vehicle" data-id="'+v.id+'">Edit car</button><button class="btn primary" data-action="book-car">Book this car</button>':'')+'</div></div>';
  var ctl='<div class="bar-row"><div class="seg"><button class="btn" data-action="mnav" data-n="-1" aria-label="Previous month">&larr;</button><button class="btn" data-action="mtoday">This month</button><button class="btn" data-action="mnav" data-n="1" aria-label="Next month">&rarr;</button></div>'+
    '<div class="range" style="margin:0">'+FULL[mon]+' '+first.getFullYear()+'</div><span class="sp"></span><span style="color:var(--muted)">'+freeN+' of '+dim+' days free</span></div>';
  var grid=DOW.map(function(d){return '<div class="mh">'+d+'</div>'}).join('');
  for(i=0;i<weeks*7;i++){
    var d=addDays(gs,i),dt=parse(d),col=i%7,bs=busyAll(v.id,d),b=bs[0];
    var cls='md'+(col%6===0?' we':'')+(d===t?' td':'')+(dt.getMonth()!==mon?' out':'');
    var chip=bs.map(function(x){
      var m=x.type==='maintenance',label=m?'Workshop · '+x.customer:x.customer;
      var showLab=d===x.start||col===0;
      return '<span class="chip'+(m?' maint':'')+(x.end<t?' past':'')+(d>x.start&&col!==0?' cl':'')+(d<x.end&&col!==6?' cr':'')+'">'+(showLab?esc(label):'&nbsp;')+'</span>';
    }).join('');
    var inner='<span class="dn">'+dt.getDate()+'</span>'+chip;
    grid+=canWrite()?'<button class="'+cls+'" data-action="mcell" data-d="'+d+'" data-id="'+(b?b.id:'')+'" aria-label="'+fmtS(d)+(b?', booked':', free')+'">'+inner+'</button>':'<div class="'+cls+'">'+inner+'</div>';
  }
  var legend='<div class="legend"><span><i class="sw rent"></i>Rental (colour matches the car)</span><span><i class="sw maint"></i>Workshop</span><span><i class="sw td"></i>Today</span>'+(canWrite()?'<span>Tap a free day to book, or a booking to edit it</span>':'')+'</div>';
  var up=S.bookings.filter(function(b){return b.vehicleId===v.id&&b.end>=t}).sort(function(a,c){return a.start<c.start?-1:1});
  var list='<div class="panel"><h2>Active and upcoming</h2>'+(up.length?'<div class="list" style="margin-top:0">'+up.map(function(b){

/* ---------- rate card (daily rates in USD) ---------- */
/* Each category: four length tiers (3-6, 7-13, 14-30, 31+ days), each [High, Mid, Low season]. */
var RATE_CARD={
  compact:[[75,60,55],[60,55,50],[50,40,40],[40,35,35]],
  sedan:[[85,75,60],[70,60,50],[60,50,45],[50,40,40]],
  jeep:[[85,75,60],[70,60,50],[60,50,45],[50,40,40]],
  suv:[[90,80,70],[80,70,60],[70,60,50],[55,45,45]],
  large:[[100,90,80],[85,75,65],[75,65,55],[60,50,45]],
  pickup:[[120,110,100],[100,90,80],[80,70,60],[65,55,50]]
};
var TIER_NAMES=['3-6 day','7-13 day','14-30 day','31+ day'];
var SEASON_NAMES=['high season','mid season','low season'];
/* High: 15 Dec - 15 Apr and 25 Jul - 8 Aug. Low: 1 Sep - 31 Oct. Everything else is mid. */
function seasonOf(d){
  var md=d.slice(5);
  if(md>='12-15'||md<='04-15')return 0;
  if(md>='07-25'&&md<='08-08')return 0;
  if(md>='09-01'&&md<='10-31')return 2;
  return 1;
}
/* Bank holidays, including the weekday a holiday is observed when it falls on a Sunday. A delivery or collection on one of these days adds half a day's rate to the last charged day. */
var HOLIDAYS={
  '2026-01-01':"New Year's Day",'2026-01-21':'Errol Barrow Day','2026-04-03':'Good Friday','2026-04-05':'Easter Sunday','2026-04-06':'Easter Monday','2026-04-28':'National Heroes Day','2026-05-01':'Labour Day','2026-05-25':'Whit Monday','2026-08-01':'Emancipation Day','2026-08-03':'Kadooment Day','2026-11-30':'Independence Day','2026-12-25':'Christmas Day','2026-12-26':'Boxing Day',
  '2027-01-01':"New Year's Day",'2027-01-21':'Errol Barrow Day','2027-03-26':'Good Friday','2027-03-28':'Easter Sunday','2027-03-29':'Easter Monday','2027-04-28':'National Heroes Day','2027-05-01':'Labour Day','2027-05-17':'Whit Monday','2027-08-01':'Emancipation Day','2027-08-02':'Kadooment Day','2027-08-03':'Emancipation Day (observed)','2027-11-30':'Independence Day','2027-12-25':'Christmas Day','2027-12-26':'Boxing Day','2027-12-27':'Boxing Day (observed)',
  '2028-01-01':"New Year's Day",'2028-01-21':'Errol Barrow Day','2028-04-14':'Good Friday','2028-04-16':'Easter Sunday','2028-04-17':'Easter Monday','2028-04-28':'National Heroes Day','2028-05-01':'Labour Day','2028-06-05':'Whit Monday','2028-08-01':'Emancipation Day','2028-08-07':'Kadooment Day','2028-11-30':'Independence Day','2028-12-25':'Christmas Day','2028-12-26':'Boxing Day'
};
function rateKey(cat){
  var c=String(cat||'').toLowerCase();
  if(c.indexOf('large')>-1||c.indexOf('7')>-1)return 'large';
  if(c.indexOf('compact')>-1)return 'compact';
  if(c.indexOf('sedan')>-1)return 'sedan';
  if(c.indexOf('jeep')>-1)return 'jeep';
  if(c.indexOf('pick')>-1)return 'pickup';
  if(c.indexOf('suv')>-1)return 'suv';
  return null;
}
function priceBreakdown(b,v){
  var key=rateKey(v&&v.category);
  if(!key||!b.start||!b.end)return null;
  var n=rentalDays(b),tier=n>=31?3:n>=14?2:n>=7?1:0,rates=RATE_CARD[key][tier],runs=[],sum=0,i,s,r,last;
  for(i=0;i<n;i++){
    s=seasonOf(addDays(b.start,i));r=rates[s];sum+=r;last=runs[runs.length-1];
    if(last&&last.s===s)last.n++;else runs.push({s:s,r:r,n:1});
  }
  var hd=HOLIDAYS[b.start]||'',hc=HOLIDAYS[b.end]||'',extra=0,both=!!(hd&&hc)&&n>1;
  if(hd||hc){extra+=rates[seasonOf(addDays(b.start,n-1))]*0.5;if(both)extra+=rates[seasonOf(b.start)]*0.5}
  return {n:n,tier:tier,runs:runs,sum:sum,extra:extra,both:both,hd:hd,hc:hc,start:b.start,end:b.end,total:Math.round((sum+extra)*100)/100};
}
function priceText(pr){
  var t='Rate card: '+pr.n+(pr.n===1?' day':' days')+' at the '+TIER_NAMES[pr.tier]+' rate'+(pr.n<3?' (rentals under 3 days use it too)':'')+': '+
    pr.runs.map(function(x){return x.n+' × '+money(x.r)+' ('+SEASON_NAMES[x.s]+')'}).join(' + ');
  if(pr.extra>0){
    var why=[];if(pr.hd)why.push('delivery on '+fmtL(pr.start)+', '+pr.hd);if(pr.hc)why.push('collection on '+fmtL(pr.end)+', '+pr.hc);
    t+=' + holiday charge $'+pr.extra.toFixed(2).replace(/\.00$/,'')+' ('+(pr.both?'first and last day':'last day')+' × 1.5; '+why.join(' and ')+')';
  }
  return esc(t+' = $'+String(pr.total));
}

/* ---------- phone links, payments, late returns ---------- */
function phoneDigits(p){var d=String(p||'').replace(/\D/g,'');if(!d)return '';if(d.length===7)d='1246'+d;else if(d.length===10)d='1'+d;return d}
function phoneLinks(p){var d=phoneDigits(p);if(!d)return esc(p||'');return esc(p)+' <a class="lnk" href="tel:+'+d+'">Call</a><a class="lnk" href="https://wa.me/'+d+'" target="_blank" rel="noopener">WhatsApp</a>'}
function payInfo(b){if(b.type==='maintenance'||b.paid==null||b.paid==='')return null;return {paid:Number(b.paid)||0,bal:bTotal(b)-(Number(b.paid)||0)}}
function payPill(b){var i=payInfo(b);if(!i)return '';return i.bal<=0.005?'<span class="pill free">Paid</span>':'<span class="pill maint">Owes '+money(i.bal)+'</span>'}
function isLate(b){
  if(b.type!=='rental'||b.returned===true||!b.end)return false;
  var now=new Date(),n=iso(now)+'T'+pad(now.getHours())+':'+pad(now.getMinutes());
  if(b.end+'T'+(b.endTime||'23:59')>=n)return false;
  return diff(b.end,iso(now))<=14;
}
function lateTag(b){return isLate(b)?'<span class="pill maint">Overdue</span>':''}

function runSheetText(){
  var t=today();
  function part(title,key,dkey,out){
    var list=S.bookings.filter(function(b){return b.type==='rental'&&b[dkey]===t}).sort(function(a,b){return (a[key]||'99').localeCompare(b[key]||'99')});
    var lines=[title+' ('+list.length+')'];
    if(!list.length)lines.push('  None');
    list.forEach(function(b,i){
      var v=vById(b.vehicleId),where=out?b.pickup:b.dropoff;
      lines.push((i+1)+'. '+(b[key]?fmtT(b[key]):'Time not set')+' - '+(v?v.name+' ('+v.plate+')':'Removed vehicle'));
      lines.push('   '+(b.customer||'Untitled')+(b.phone?' - '+b.phone:''));
      var pi=payInfo(b);if(pi&&pi.bal>0.005)lines.push('   Balance due: '+money(pi.bal));
      if(where)lines.push('   '+(out?'Deliver to: ':'Collect from: ')+where);
      if(b.staying)lines.push('   Staying: '+b.staying);
      if(b.notes)lines.push('   Notes: '+b.notes);
    });
    return lines.join('\n');
  }
  return 'Run sheet - '+fmtL(t)+'\n\n'+part('DELIVERIES','startTime','start',true)+'\n\n'+part('RETURNS','endTime','end',false);
}
function copyText(txt){
  function fallback(){
    var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);
    var ok=false;try{ok=document.execCommand('copy')}catch(e){}
    document.body.removeChild(ta);return ok;
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(txt).then(function(){return true},function(){return fallback()});
  }
  return Promise.resolve(fallback());
}
function exportRows(){
  var vs=S.vehicles.slice().sort(function(a,b){return (a.name||'').localeCompare(b.name||'')});
  var fleet=[['Vehicle','Plate','Type','Seats','Transmission','Daily rate (USD)','Colour','Notes']].concat(vs.map(function(v){
    return [v.name||'',v.plate||'',v.category||'',v.seats==null?'':v.seats,v.transmission||'',v.rate==null?'':v.rate,v.color||'',v.notes||''];
  }));
  var bs=S.bookings.slice().sort(function(a,b){return ((a.start||'')+(a.startTime||'')).localeCompare((b.start||'')+(b.startTime||''))});
  var book=[['Vehicle','Plate','Type','Customer','Phone','Staying at','Pick-up location','Drop-off location','Start date','Start time','End date','End time','Days (24h)','Total (USD)','Paid (USD)','Returned','Notes']].concat(bs.map(function(b){
    var v=vById(b.vehicleId),m=b.type==='maintenance';
    return [v?v.name:'Removed vehicle',v?v.plate:'',m?'Workshop':'Rental',b.customer||'',b.phone||'',b.staying||'',b.pickup||'',b.dropoff||'',b.start||'',b.startTime||'',b.end||'',b.endTime||'',m?'':rentalDays(b),m?'':bTotal(b),b.paid==null?'':b.paid,b.returned?'Yes':'',b.notes||''];
  }));
  var bills=[['Payment','Reference','Amount (USD)','Due day','Note','Tracking from']].concat(S.bills.slice().sort(function(a,b){return (a.dueDay-b.dueDay)||String(a.name).localeCompare(String(b.name))}).map(function(x){return [x.name||'',x.ref||'',x.amount==null?'Varies':x.amount,x.dueDay||'',x.note||'',x.startMonth||'']}));
  var paid=[['Payment','Reference','For month','Paid on','Amount paid (USD)']].concat(S.billPaid.slice().sort(function(a,b){return String(b.paidOn).localeCompare(String(a.paidOn))}).map(function(x){var b=S.bills.find(function(y){return y.id===x.billId})||{};return [b.name||'Removed payment',b.ref||'',x.month||'',x.paidOn||'',x.amount==null?'':x.amount]}));
  return {fleet:fleet,bookings:book,bills:bills,paid:paid};
}
function csvOf(rows){
  return rows.map(function(r){return r.map(function(c){c=String(c==null?'':c);return /[",\n\r]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')}).join('\r\n');
}
function saveBlob(name,blob){
  var a=document.createElement('a'),u=URL.createObjectURL(blob);

function bookingMeta(){
  var m=S.modal.data,box=$('#f-meta'),btn=$('#f-save');if(!box)return;

  else if(!m.startTime||!m.endTime){msg='Enter both times.';bad=true}
  else if(m.end+'T'+m.endTime<=m.start+'T'+m.startTime){msg='The return time must be after the pick-up time.';bad=true}
  else{
    var n=rentalDays({start:m.start,end:m.end,startTime:m.startTime,endTime:m.endTime}),c=conflicts(m.vehicleId,m.start,m.end,m.id,m.startTime,m.endTime);

/* Each payment recurs monthly on its due day (the last day of the month when the month is shorter). It keeps showing as overdue every day until it is marked paid. */

  ['Signia','3353487',1289.65,1,'H4204'],['Signia','3356129',1477.96,1,'H4573 & H5831'],['Signia','3358718',1065,1,'Zm984'],

  ['Sagicor - life insurance','',322.35,21,'Tramaine'],['Flow - phone bill','',420,21,''],['Island Drive - Kicks lease','',1317.71,21,'z1145'],
  ['Simpson Finance','070658',796.40,23,'H4042'],

  ['Simpson Finance','071557',897.75,29,'H4148'],

  ['Simpson Finance','073047',732.05,31,'H4574']

var monthKey=function(d){return d.slice(0,7)};
var addMonths=function(ym,n){var p=ym.split('-').map(Number),d=new Date(p[0],p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
var dueDateFor=function(b,ym){var p=ym.split('-').map(Number),last=new Date(p[0],p[1],0).getDate();return ym+'-'+pad(Math.min(Number(b.dueDay)||1,last))};
function billInstances(){
  var t=today(),endM=monthKey(addDays(t,7)),paidBy={},out=[];
  S.billPaid.forEach(function(x){paidBy[x.id]=x});
  S.bills.forEach(function(b){
    if(b.active===false)return;
    var m=b.startMonth||monthKey(t),g=0;
    for(;m<=endM&&g<240;g++,m=addMonths(m,1)){
      var key=b.id+'_'+m,due=dueDateFor(b,m);
      if(m>monthKey(t)&&due>addDays(t,7))continue; /* next month only appears once a bill is within a week of falling due */
      out.push({key:key,bill:b,month:m,due:due,paid:paidBy[key]||null});
    }
  });
  return out;
}
function payAttention(){var lim=addDays(today(),3);return billInstances().filter(function(i){return !i.paid&&i.due<=lim})}
function payBanner(){
  var t=today(),a=payAttention(),od=a.filter(function(i){return i.due<t}).length,soon=a.length-od,h='';
  if(od)h+='<button class="late-banner red" data-action="tab" data-v="payments">'+od+(od===1?' payment overdue':' payments overdue')+' - tap to see</button>';
  if(soon)h+='<button class="late-banner" data-action="tab" data-v="payments">'+soon+(soon===1?' payment due':' payments due')+' in the next 3 days - tap to see</button>';
  return h;
}
function payRow(i){
  var b=i.bill,t=today(),n=diff(t,i.due),late=!i.paid&&n<0;
  var when=i.paid?'Paid '+fmtS(i.paid.paidOn)+' (due '+fmtS(i.due)+')':late?'Overdue by '+(-n)+(n===-1?' day':' days')+' · was due '+fmtS(i.due):n===0?'Due today':n===1?'Due tomorrow':'Due '+fmtL(i.due)+' · in '+n+' days';
  var amt=i.paid?(i.paid.amount==null||i.paid.amount===''?'':moneyP(i.paid.amount)):(b.amount==null||b.amount===''?'Varies':moneyP(b.amount));
  return '<div class="row'+(late?' late':'')+'"><div class="main"><strong>'+esc(b.name)+'</strong><span class="sub">'+esc([b.ref,b.note].filter(Boolean).join(' · '))+'</span></div>'+
    '<div class="c2 sub">'+esc(when)+'</div><div class="num">'+amt+'</div>'+
    (canWrite()?(i.paid?'<button class="btn sm" data-action="unpay" data-key="'+esc(i.key)+'">Undo</button>':'<button class="btn sm primary" data-action="pay-bill" data-key="'+esc(i.key)+'">Mark paid</button>'):'<span></span>')+'</div>';
}
function paymentsHTML(){
  var head='<div class="bar-row"><h2 style="margin:0;flex:1">Payments</h2>'+(canWrite()?'<button class="btn sm" data-action="add-bill">Add payment</button>':'')+'</div>';
  if(!S.bills.length)return head+'<div class="empty"><h2>No monthly payments yet</h2><p>Add the bills you pay each month. Anything not marked paid keeps showing here, and in the banner at the top, until you mark it paid.</p>'+
    (canWrite()?'<button class="btn primary" data-action="load-bills">Load my '+SEED_BILLS.length+' monthly payments</button> <button class="btn" data-action="add-bill">Add one</button>':'')+'</div>';
  var t=today(),cm=monthKey(t),lim=addDays(t,3),inst=billInstances(),by=function(a,b){return a.due<b.due?-1:a.due>b.due?1:String(a.bill.name).localeCompare(String(b.bill.name))};
  var unpaid=inst.filter(function(i){return !i.paid}).sort(by);
  var od=unpaid.filter(function(i){return i.due<t}),soon=unpaid.filter(function(i){return i.due>=t&&i.due<=lim}),later=unpaid.filter(function(i){return i.due>lim});
  var paid=inst.filter(function(i){return i.paid&&(i.month===cm||(i.paid.paidOn||'')>=addDays(t,-14))}).sort(function(a,b){return String(b.paid.paidOn).localeCompare(String(a.paid.paidOn))});
  var mine=inst.filter(function(i){return i.month===cm}),left=0,done=0,vary=0;
  mine.forEach(function(i){if(i.paid)done+=Number(i.paid.amount)||0;else if(i.bill.amount==null||i.bill.amount==='')vary++;else left+=Number(i.bill.amount)||0});
  var grp=function(title,list){return list.length?'<h3 class="grp">'+title+' · '+list.length+'</h3><div class="list">'+list.map(payRow).join('')+'</div>':''};
  var all=S.bills.slice().sort(function(a,b){return (a.dueDay-b.dueDay)||String(a.name).localeCompare(String(b.name))});
  return head+'<div class="pay-sum"><span>Still to pay this month <b>'+moneyP(left)+'</b></span><span>Paid so far <b>'+moneyP(done)+'</b></span>'+(vary?'<span>'+vary+(vary===1?' bill that varies':' bills that vary')+' not yet paid</span>':'')+'</div>'+
    (unpaid.length?'':'<p style="color:var(--muted)">Nothing is waiting to be paid right now.</p>')+
    grp('Overdue',od)+grp('Due in the next 3 days',soon)+grp('Coming up',later)+grp('Recently paid',paid)+
    '<h3 class="grp">All monthly payments · '+all.length+'</h3><div class="list">'+all.map(function(b){
      return '<div class="row"><div class="main"><strong>'+esc(b.name)+'</strong><span class="sub">'+esc([b.ref,b.note].filter(Boolean).join(' · '))+'</span></div><div class="c2 sub">Every month on the '+b.dueDay+ordSuffix(b.dueDay)+'</div><div class="num">'+(b.amount==null||b.amount===''?'Varies':moneyP(b.amount))+'</div>'+(canWrite()?'<button class="btn sm" data-action="edit-bill" data-id="'+esc(b.id)+'">Edit</button>':'<span></span>')+'</div>'}).join('')+'</div>';
}
function ordSuffix(n){n=Number(n);var r=n%100;return (r>=11&&r<=13)?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th')}
function loadBills(btn){
  if(S.bills.length||btn.disabled)return;btn.disabled=true;
  var t=today(),cur=monthKey(t),day=Number(t.slice(8));
  Promise.all(SEED_BILLS.map(function(x,i){
    /* A payment already due earlier this month starts being tracked from next month; the rest from this month. */
    return save('bills',{id:'bill-'+pad(i+1),name:x[0],ref:x[1],amount:x[2],dueDay:x[3],note:x[4],startMonth:x[3]<=day?addMonths(cur,1):cur,active:true,created:Date.now()});
  })).then(function(r){toast(r.every(Boolean)?'Loaded '+SEED_BILLS.length+' monthly payments':'Some payments could not be saved')});
}
function openBill(b){
  if(!canWrite())return;
  S.modal={kind:'bill',data:Object.assign({name:'',ref:'',amount:'',dueDay:1,note:'',startMonth:monthKey(today())},b||{}),confirm:false};
  if(S.modal.data.amount==null)S.modal.data.amount='';
  drawModal();
}
function billModal(){
  var m=S.modal.data,edit=!!m.id;
  return '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">'+(edit?'Edit payment':'Add payment')+'</h2><div class="form">'+
    '<label>Who or what it is for<input id="b-name" value="'+esc(m.name)+'" placeholder="Simpson Finance" autocomplete="off"></label>'+
    '<label>Account or reference number<input id="b-ref" value="'+esc(m.ref)+'" autocomplete="off"></label>'+
    '<div class="grid2"><label>Amount (USD)<input id="b-amt" type="number" min="0" step="0.01" inputmode="decimal" value="'+esc(m.amount)+'" placeholder="Leave blank if it varies"></label>'+
    '<label>Due on day of month<input id="b-day" type="number" min="1" max="31" inputmode="numeric" value="'+esc(m.dueDay)+'"></label></div>'+
    '<label>Vehicle or note<input id="b-note" value="'+esc(m.note)+'" autocomplete="off"></label>'+
    '<label>Start reminding from<input id="b-start" type="month" value="'+esc(m.startMonth)+'"></label>'+
    '<div id="f-meta" class="meta">Months with fewer days than the due day are due on the last day of the month.</div></div>'+
    '<div class="actions">'+(edit?'<button class="btn danger" data-action="del">Delete</button>':'')+'<span class="sp"></span><button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="save">Save</button></div></div>';
}
function saveBill(){
  var g=function(id){return document.getElementById(id).value},m=S.modal.data,name=g('b-name').trim(),day=parseInt(g('b-day'),10),start=g('b-start');
  var meta=$('#f-meta');
  if(!name||!(day>=1&&day<=31)){meta.className='meta bad';meta.textContent='Enter a name and a due day between 1 and 31.';return}
  if(!/^\d{4}-\d{2}$/.test(start)){meta.className='meta bad';meta.textContent='Choose the month to start reminding from.';return}
  var amt=g('b-amt').trim();
  var obj=Object.assign({},m,{id:m.id||uid('p'),name:name,ref:g('b-ref').trim(),amount:amt===''?null:Number(amt)||0,dueDay:day,note:g('b-note').trim(),startMonth:start,active:true,created:m.created||Date.now()});
  save('bills',obj).then(function(ok){if(ok){closeModal();toast('Saved')}});
}
function openPay(i){
  var b=i.bill;
  S.modal={kind:'pay',data:{key:i.key,billId:b.id,month:i.month,name:b.name,due:i.due,amount:b.amount==null?'':b.amount,paidOn:today()}};drawModal();
}
function payModal(){
  var m=S.modal.data;
  return '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">Mark paid</h2><p class="sub" style="margin:4px 0 8px">'+esc(m.name)+' · due '+esc(fmtL(m.due))+'</p><div class="form">'+
    '<label>Amount paid (USD)<input id="p-amt" type="number" min="0" step="0.01" inputmode="decimal" value="'+esc(m.amount)+'" placeholder="Enter the amount"></label>'+
    '<label>Paid on<input id="p-date" type="date" value="'+esc(m.paidOn)+'"></label><div id="f-meta" class="meta"></div></div>'+
    '<div class="actions"><span class="sp"></span><button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="save">Save</button></div></div>';
}
function savePay(){
  var m=S.modal.data,amt=document.getElementById('p-amt').value.trim(),dt=document.getElementById('p-date').value,meta=$('#f-meta');
  if(!dt){meta.className='meta bad';meta.textContent='Choose the date it was paid.';return}
  save('billPaid',{id:m.key,billId:m.billId,month:m.month,paidOn:dt,amount:amt===''?null:Number(amt)||0}).then(function(ok){if(ok){closeModal();toast('Marked paid')}});
}

/* ---------- boot ---------- */
function mapDocs(snap){return snap.docs.map(function(d){return Object.assign({id:d.id},d.data())})}
function init(){
  fromHash();renderAll();
  firebase.auth().onAuthStateChanged(function(user){
    document.getElementById('loginGate').hidden=!!user;
    document.getElementById('signOut').hidden=!user;
    if(window.fleetUnsub){window.fleetUnsub.forEach(function(fn){fn()});window.fleetUnsub=null}
    S.vehicles=[];S.bookings=[];S.bills=[];S.billPaid=[];gotV=false;gotB=false;
    if(!user){db=null;S.ready=false;renderAll();return}
    db=firebase.firestore();S.ready=true;S.warn='Loading saved fleet data…';renderAll();
    var fail=function(e){S.warn='Cannot read Firebase data. Check your Firestore rules and account access.';renderAll()};
    var u1=db.collection('vehicles').onSnapshot(function(s){S.vehicles=mapDocs(s);gotV=true;if(gotB)S.warn='';renderAll()},fail);
    var u2=db.collection('bookings').onSnapshot(function(s){S.bookings=mapDocs(s);gotB=true;if(gotV)S.warn='';renderAll()},fail);
    var u3=db.collection('bills').onSnapshot(function(s){S.bills=mapDocs(s);renderAll()},fail);
    var u4=db.collection('billPaid').onSnapshot(function(s){S.billPaid=mapDocs(s);renderAll()},fail);
    window.fleetUnsub=[u1,u2,u3,u4];
  });
}
init();
})();
</script>

</body></html>
